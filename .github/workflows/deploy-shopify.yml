name: Deploy Shopify App

on:
  push:
    branches:
      - main

jobs:
  deploy-shopify:
    name: Deploy Shopify App and Theme Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Shopify CLI
        run: pnpm add --global @shopify/cli@4.7.0

      - name: Check Shopify token
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$SHOPIFY_CLI_PARTNERS_TOKEN" ]; then
            echo "SHOPIFY_APP_AUTOMATION_TOKEN is NOT configured"
            exit 1
          else
            echo "Shopify automation token is configured"
          fi

      - name: Deploy Shopify App
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: shopify app deploy --config development --allow-updates